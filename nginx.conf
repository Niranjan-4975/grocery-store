server {
    listen 80;
    server_name _;

    # Allow product image uploads up to 10 MB (matches Spring Boot SecurityConfig)
    client_max_body_size 10M;

    # 1. Serve compiled Vue.js Single Page App
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Explicitly block internal/debug backend paths from public access
    location ~ ^/(actuator|swagger-ui|v3/api-docs) {
        return 403;
    }

    # 3. Forward API calls internally to Spring Boot (ClusterIP)
    location /api/ {
        proxy_pass http://backend-svc:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Forward real-time WebSocket stock updates (SockJS / STOMP)
    location /ws-grocery/ {
        proxy_pass http://backend-svc:8080/ws-grocery/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 5. Forward local fallback product images if Cloudinary is disabled
    location /images/ {
        proxy_pass http://backend-svc:8080/images/;
        proxy_set_header Host $host;
    }
}