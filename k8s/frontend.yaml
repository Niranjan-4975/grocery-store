apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocery-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocery-frontend
  template:
    metadata:
      labels:
        app: grocery-frontend
    spec:
      containers:
        - name: frontend
          image: grocery-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: grocery-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085